name: build

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore src/NetDoctor.csproj

      - name: 构建（Release）
        run: dotnet build src/NetDoctor.csproj -c Release --no-restore

      - name: 构建自测工程
        run: dotnet build selftest/SelfTest.csproj -c Release

      # 自测依赖真机网络与硬件，在 CI 上只跑稳定项；
      # 若失败不阻断发布，仅作为提示。
      - name: 运行自测（允许失败）
        continue-on-error: true
        run: selftest/bin/Release/net10.0-windows/NetDoctorSelfTest.exe
        shell: cmd

      - name: 发布单文件自包含 exe
        run: >
          dotnet publish src/NetDoctor.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      # windows-latest 自带 VS 2022 的 C++ 生成工具与 Windows SDK，可直接编译 NativeAOT
      - name: 构建 x86 原生 DLL（给易语言调用）
        run: dotnet publish native/NetDoctorNative.csproj -c Release -r win-x86 -o publish

      # 用 --ci 模式：只判定「契约」类断言（DLL 能加载、导出齐全、
      # JSON 合法、错误处理不崩溃宿主、内存管理正常）。
      # runner 上没有真机网络与硬件，涉及网卡/DNS/显卡/磁盘/第三方服务的项
      # 会标注为 [env] 而不计入失败，避免误报。
      - name: 原生 DLL 调用测试（x86 宿主模拟易语言调用）
        run: |
          dotnet publish native-test/NetDoctorNativeTest.csproj -c Release -r win-x86
          Copy-Item publish/NetDoctorNative.dll native-test/bin/Release/net10.0/win-x86/publish/ -Force
          native-test/bin/Release/net10.0/win-x86/publish/NetDoctorNativeTest.exe --ci
        shell: pwsh

      # 压力测试：专测异常路径（非法指针、畸形入参、并发、缓冲区复用）。
      # 这些都是契约级要求，任何环境下都必须成立，所以不加 --ci。
      - name: 原生 DLL 压力 / 边界测试
        run: |
          dotnet publish native-test/StressTest.csproj -c Release -r win-x86
          Copy-Item publish/NetDoctorNative.dll native-test/bin/Release/net10.0/win-x86/publish/ -Force
          native-test/bin/Release/net10.0/win-x86/publish/NetDoctorStressTest.exe
        shell: pwsh

      # softprops/action-gh-release 对非 ASCII 文件名支持有问题，
      # 中文名的 exe 传上去会变成 default.exe，所以先复制一份 ASCII 名再上传。
      - name: 为 Release 准备 ASCII 文件名
        shell: pwsh
        run: |
          Copy-Item 'publish/夕颜若雪网络工具.exe' 'publish/NetDoctor-win-x64.exe' -Force
          Get-ChildItem publish | ForEach-Object { Write-Host "  $($_.Name)  $([math]::Round($_.Length/1MB,2)) MB" }

      - name: 收集产物信息
        id: info
        shell: pwsh
        run: |
          $exe = Get-Item 'publish/NetDoctor-win-x64.exe'
          $dll = Get-Item 'publish/NetDoctorNative.dll'
          $mb  = [math]::Round($exe.Length / 1MB, 1)
          $dm  = [math]::Round($dll.Length / 1MB, 1)
          $sha = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $dsha = (Get-FileHash $dll.FullName -Algorithm SHA256).Hash
          "size=$mb"       >> $env:GITHUB_OUTPUT
          "dllsize=$dm"    >> $env:GITHUB_OUTPUT
          "sha=$sha"       >> $env:GITHUB_OUTPUT
          "dllsha=$dsha"   >> $env:GITHUB_OUTPUT
          Write-Host "主程序：$mb MB  SHA256=$sha"
          Write-Host "原生DLL：$dm MB  SHA256=$dsha"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: NetDoctor-win-x64
          path: |
            publish/NetDoctor-win-x64.exe
            publish/NetDoctorNative.dll
          if-no-files-found: error

      # 如果同名 Release 已存在（例如重推 tag），先删掉再重建，
      # 避免旧附件残留（曾经因为文件名问题留下过 default.exe）。
      # GitHub 删除 tag 的 Release 后需要等索引刷新，所以这里等一下。
      - name: 清理同名旧 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        continue-on-error: true
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "发现已存在的 Release $tag，删除后重建"
            gh release delete $tag --repo '${{ github.repository }}' --yes --cleanup-tag=false
            Start-Sleep -Seconds 8
          } else {
            Write-Host "没有同名 Release，直接创建"
          }

      - name: 附加到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/NetDoctor-win-x64.exe
            publish/NetDoctorNative.dll
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## 夕颜若雪网络工具 ${{ github.ref_name }}

            两个产物，按需下载：

            ### 1. 独立程序 `NetDoctor-win-x64.exe`（${{ steps.info.outputs.size }} MB）
            单文件自包含，**双击即可运行**，无需安装 .NET 运行时。
            首次运行会请求管理员权限（修复、优化、服务、启动项、清理都需要）。
            程序内显示的名字是「夕颜若雪网络工具」，下载后可以随意改名。
            - SHA256：`${{ steps.info.outputs.sha }}`

            ### 2. 原生接口库 `NetDoctorNative.dll`（${{ steps.info.outputs.dllsize }} MB，x86）
            给 **32 位易语言**程序 `LoadLibrary` 调用的原生 DLL，NativeAOT 编译，**宿主无需安装 .NET**。
            15 个 `__stdcall` 导出函数，统一返回 UTF-8 JSON。
            - SHA256：`${{ steps.info.outputs.dllsha }}`
            - 用法见 `docs/原生接口.md` 与 `docs/易语言接入.md`

            ### 功能
            网络检测 / 断网修复 / 网络优化 · Windows 优化（151 项）
            · 垃圾清理 / 应用管理 / 系统服务 / 启动项 · 硬件检测 / 工具启动器 / 性能测试 / 屏幕测试

            ### 说明
            - 所有写操作都会在 `backup/` 下留快照，可对照回滚
            - 运行日志在 `logs/`，出问题请附日志反馈
            - 系统优化有风险，请先备份重要数据，详见 README 免责声明
